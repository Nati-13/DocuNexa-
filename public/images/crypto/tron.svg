  <circle cx="500" cy="500" r="500" fill="#EB0029"/>
  <!-- TRON Faceted Prism Glyph -->
  <g stroke="#EB0029" stroke-width="6" stroke-linejoin="round">
    <!-- Top-Left Facet -->
    <polygon points="260,390 730,285 490,540" fill="#FFFFFF"/>
