  <path
    d="M 20 2
       L 20 8
       A 2 2 0 0 0 22 10
       L 28 10
       Z"
    fill="url(#foldGrad)"
  />

  <!-- Stylized Geometric 'N' -->
  <path
    d="M 8.5 11
